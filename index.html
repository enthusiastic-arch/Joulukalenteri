<script>
    // Tämä script hakee kaikki luukut ja lukitsee ne luukut joita ei saa vielä avata

    // Haetaan kaikki luukut
    // getElementsByClassName() voidaan targetoida kaikki <div> elementit joilla on class "door"
    let luukut = document.getElementsByClassName("door")
    
    // Nykyinen päivämäärä
     const today = new Date().getDate();
   // let month = today.getMonth(); "kuukausi nyt"

    // Lukitaan luukut joita ei saa vielä avata
    for (let i = 0; i < luukut.length; i++) {
        let kierros_luukku = luukut[i]

        // Annetaan luukulle dataset tieto päivämäärästä, esim i = 1
        kierros_luukku.dataset.day = i; 

        // Jos luukku on tänään, lisätään today class
        if (i === today) {
            kierros_luukku.classList.add('today');
        }
        
        // Jos luukun päivämäärä on tulevaisuudessa lisätään locked luokka ja
        // Lisätään alert ilmoitus että luukku on vielä lukossa
        if (i > today) {
            // Locked luokan lisäys
            kierros_luukku.classList.add('locked');

        
        // if (month !== 11) { Lukitaan kalenteri jos ei ole joulukuu?
        
       // kierros_luukku.classList.add('locked');

            // Lukittu ilmoitus
            kierros_luukku.addEventListener('click', () => {
                alert("Tämä luukku on vielä lukittu!");  
            });
        }        
    }
</script>
